<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M. Bolger Rare Books — Rare Books &amp; Manuscripts</title>
  <meta name="description" content="M. Bolger Rare Books — Antiquarian books, early printing, and manuscripts across Hong Kong and Ireland.">
  <link rel="canonical" href="https://bolgerbooks.com/" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      background-color: #EDE9D6;
      color: #37342B;
      font-family: "Libre Baskerville", "EB Garamond", "Baskerville", "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .card-outer {
      background-color: #F2EFDE;
      border: 1.25px solid #4B483C;
      padding: 5px;
      max-width: 660px;
      width: 100%;
      box-shadow: 0 14px 36px rgba(55, 52, 43, 0.08);
    }

    .card-inner {
      border: 1px solid #4B483C;
      padding: 54px 38px;
      text-align: center;
    }

    h1 {
      font-family: "Libre Baskerville", "EB Garamond", "Baskerville", Georgia, serif;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      color: #37342B;
      margin-bottom: 10px;
    }

    .tagline {
      font-family: "EB Garamond", "Libre Baskerville", "Baskerville", Georgia, serif;
      font-size: 23px;
      font-style: italic;
      font-weight: 400;
      color: #37342B;
      letter-spacing: 0.02em;
    }

    .emblem {
      margin: 26px auto;
      width: 74px;
      height: auto;
      display: block;
    }

    .principal {
      font-family: "EB Garamond", "Libre Baskerville", "Baskerville", Georgia, serif;
      font-size: 23px;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: #37342B;
      margin-bottom: 4px;
    }

    .locations {
      font-family: "EB Garamond", "Libre Baskerville", "Baskerville", Georgia, serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #37342B;
      margin-bottom: 26px;
    }

    .divider {
      width: 180px;
      height: 1px;
      background-color: #B5B09E;
      margin: 0 auto 24px auto;
    }

    .statement {
      max-width: 470px;
      margin: 0 auto 26px auto;
      font-family: "EB Garamond", "Libre Baskerville", "Baskerville", Georgia, serif;
      font-size: 18px;
      color: #37342B;
    }

    .contact-links {
      font-family: "EB Garamond", "Libre Baskerville", "Baskerville", Georgia, serif;
      font-size: 18px;
      color: #37342B;
    }

    .contact-links a {
      display: inline-block;
      color: #37342B;
      text-decoration: none;
      border-bottom: 1px solid #8A8473;
      padding-bottom: 1px;
      margin: 3px 0;
    }

    .contact-links a:hover {
      border-bottom-color: #37342B;
      opacity: 0.8;
    }

    .catalogue-note {
      display: block;
      margin-top: 8px;
      font-size: 17px;
      font-style: italic;
      color: #37342B;
    }

    @media (max-width: 520px) {
      .card-inner {
        padding: 36px 20px;
      }
      h1 {
        font-size: 19px;
        letter-spacing: 0.12em;
      }
      .tagline, .principal {
        font-size: 20px;
      }
    }
  </style>
